<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1>My Website Style Guide</h1>
    <section class="colors">
        <div class="container">
            <h2>Colors</h2>
            <div class="color-palette">
        
                <div class="color-card cool-blue">
                    <h3>Cool Blue</h3>
                    <p>#2d54e4</p>
                </div>

                <div class="color-card pink">
                    <h3>Pink</h3>
                    <p>#d957d9</p>
                </div>

                <div class="color-card mint-green">
                    <h3>Mint Green</h3>
                    <p>#f4fe0b0</p>
                </div>

                <div class="color-card beige">
                    <h3>Beige</h3>
                    <p>#efd9ca</p>
                </div>
                
            </div>
        </div>
    </section>

            
    <section class="fonts">
        <div class="container">
            <div class="font">
                <h2>Fonts</h2>
            </div> 
        </div>
            
    </section>

    <section class="textstyles">
        <div class="container">
            <div class="textstyle">
                <h2>Text Styles</h2>
            </div>
        </div>
    </section>

</body>
</html>
